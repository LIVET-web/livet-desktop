# Genera los instaladores de LIVET en los servidores de GitHub.
# Cada vez que se sube un cambio a main, arma los instaladores y los publica en Releases
# con la versión de package.json (por ejemplo v1.0.0). Enlace fijo de descarga:
# https://github.com/LIVET-web/livet-desktop/releases/latest
name: Instaladores LIVET

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Armar instalador
        run: npm run dist

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: LIVET-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leer versión
        id: ver
        run: echo "v=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Bajar instaladores
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.v }}
          name: LIVET ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.v }}
          make_latest: true
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
