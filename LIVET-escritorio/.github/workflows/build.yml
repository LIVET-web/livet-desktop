# Genera los instaladores de LIVET en los servidores de GitHub.
# - "Run workflow" (pestaña Actions): arma los instaladores y los deja para descargar en esa ejecución.
# - Crear un tag que empiece con "v" (por ejemplo v1.0.0): además los publica en Releases,
#   con un enlace fijo para que cualquiera los descargue.
name: Instaladores LIVET

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Armar instalador
        run: npm run dist

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: LIVET-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
